name: Detect Relevant Changes
description: "Detect changes matching file type and glob filters between two refs"
inputs:
  repo-path:
    description: "Path to the checked-out repository"
    required: true
  base-ref:
    description: "Git reference or commit hash representing the diff base"
    required: false
    default: ""
  head-ref:
    description: "Git reference or commit hash representing the diff head"
    required: false
    default: ""
  file-type:
    description: "File type key or list of keys (comma or newline separated)"
    required: false
    default: ""
  include-globs:
    description: "Optional glob filters (comma or newline separated)"
    required: false
    default: ""
  exclude-globs:
    description: "Optional glob filters to exclude (comma or newline separated)"
    required: false
    default: ""
  type-pattern-add:
    description: >-
      Additional type-to-glob mappings (comma or newline separated, e.g. cpp:*.cc). '.in' variants are added
      automatically.
    required: false
    default: ""
outputs:
  matched:
    description: "true if matching files were found"
    value: ${{ steps.detect.outputs.matched }}
  matched_files:
    description: "Newline-delimited list of matching files"
    value: ${{ steps.detect.outputs.matched_files }}
runs:
  using: composite
  steps:
    - name: Detect matching files
      id: detect
      shell: bash
      working-directory: ${{ inputs.repo-path }}
      env:
        BASE_REF: ${{ inputs.base-ref }}
        HEAD_REF: ${{ inputs.head-ref }}
        FILE_TYPE: ${{ inputs.file-type }}
        INCLUDE_GLOBS: ${{ inputs.include-globs }}
        EXCLUDE_GLOBS: ${{ inputs.exclude-globs }}
        TYPE_PATTERN_ADD: ${{ inputs.type-pattern-add }}
      # yamllint disable rule:line-length
      run: |
        set -euo pipefail

        shopt -s extglob globstar nullglob
        tmp_dir=$(mktemp -d "$RUNNER_TEMP/detect-relevant-changes.XXXXXX")
        trap 'rm -rf "$tmp_dir"' EXIT

        declare -A DEFAULT_TYPE_PATTERNS
        DEFAULT_TYPE_PATTERNS[cpp]=$'*.cpp\n*.hpp'
        DEFAULT_TYPE_PATTERNS[cmake]=$'CMakeLists.txt\n*.cmake'
        DEFAULT_TYPE_PATTERNS[python]=$'*.py'
        DEFAULT_TYPE_PATTERNS[md]=$'*.md'
        DEFAULT_TYPE_PATTERNS[jsonnet]=$'*.jsonnet\n*.libsonnet'
        DEFAULT_TYPE_PATTERNS[yaml]=$'*.yaml\n*.yml'
        # Types that do not support .in variants for relevance detection
        declare -A NO_IN_VARIANT_TYPES
        NO_IN_VARIANT_TYPES[jsonnet]="1"
        NO_IN_VARIANT_TYPES[yaml]="1"

        parse_list() {
          local input="$1"
          printf '%s' "$input" | tr ',' '\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d'
        }

        declare -A TYPE_PATTERNS
        for key in "${!DEFAULT_TYPE_PATTERNS[@]}"; do
          TYPE_PATTERNS[$key]="${DEFAULT_TYPE_PATTERNS[$key]}"
        done

        while IFS= read -r add; do
          [ -z "$add" ] && continue
          if [[ "$add" != *:* ]]; then
            echo "::warning::Ignoring invalid type definition without a colon."
            continue
          fi
          type_name=${add%%:*}
          pattern=${add#*:}
          pattern=${pattern#./}
          if [[ ! "$type_name" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "::warning::Ignoring invalid type name."
            continue
          fi
          if [ -n "$pattern" ]; then
            existing_patterns=${TYPE_PATTERNS["$type_name"]:-}
            TYPE_PATTERNS["$type_name"]="${existing_patterns}${existing_patterns:+$'\n'}$pattern"
          fi
        done < <(parse_list "$TYPE_PATTERN_ADD")

        mapfile -t REQUESTED_TYPES < <(parse_list "$FILE_TYPE")
        mapfile -t INCLUDE_PATTERNS < <(parse_list "$INCLUDE_GLOBS")
        mapfile -t EXCLUDE_PATTERNS < <(parse_list "$EXCLUDE_GLOBS")

        if [ -z "$HEAD_REF" ]; then
          HEAD_REF=$(git rev-parse HEAD)
        fi

        if [ -z "$BASE_REF" ]; then
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            BASE_REF=$(git rev-parse HEAD^)
          else
            BASE_REF=$(git rev-parse HEAD)
          fi
        fi

        if ! HEAD_COMMIT=$(git rev-parse --verify --end-of-options "${HEAD_REF}^{commit}" 2>/dev/null); then
          echo "::warning::Could not resolve the requested head commit; conservatively reporting changes."
          echo "matched=true" >> "$GITHUB_OUTPUT"
          echo "matched_files=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if ! BASE_COMMIT=$(git rev-parse --verify --end-of-options "${BASE_REF}^{commit}" 2>/dev/null); then
          echo "::warning::Could not resolve the requested base commit; conservatively reporting changes."
          echo "matched=true" >> "$GITHUB_OUTPUT"
          echo "matched_files=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        git diff --name-only -z "$BASE_COMMIT...$HEAD_COMMIT" > "$tmp_dir/changed-files.bin"
        : > "$tmp_dir/changed-files.txt"
        while IFS= read -r -d '' changed_file; do
          if [[ "$changed_file" == *$'\n'* || "$changed_file" == *$'\r'* ]]; then
            echo "::warning::A changed path contains a line break; conservatively reporting relevant changes."
            echo "matched=true" >> "$GITHUB_OUTPUT"
            echo "matched_files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$changed_file" >> "$tmp_dir/changed-files.txt"
        done < "$tmp_dir/changed-files.bin"

        if [ ! -s "$tmp_dir/changed-files.txt" ]; then
          : > "$tmp_dir/matched-files.txt"
          echo "matched=false" >> "$GITHUB_OUTPUT"
          echo "matched_files=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        declare -A PATTERN_SET=()

        if [ "${#REQUESTED_TYPES[@]}" -ne 0 ]; then
          add_pattern_variant() {
            local base_pattern="$1"
            [ -z "$base_pattern" ] && return
            PATTERN_SET["$base_pattern"]=1
            if [[ "$base_pattern" != *.in ]]; then
              PATTERN_SET["$base_pattern.in"]=1
            fi
          }

          for type in "${REQUESTED_TYPES[@]}"; do
            if [[ ! "$type" =~ ^[a-zA-Z0-9_-]+$ ]]; then
              echo "::warning::Ignoring invalid requested type."
              continue
            fi
            patterns=${TYPE_PATTERNS["$type"]:-}
            if [ -z "$patterns" ]; then
              echo "::warning::No patterns are defined for a requested type."
              continue
            fi
            while IFS= read -r pattern; do
              pattern=${pattern#./}
              [ -z "$pattern" ] && continue
              if [ -n "${NO_IN_VARIANT_TYPES[$type]:-}" ]; then
                PATTERN_SET["$pattern"]=1
              else
                add_pattern_variant "$pattern"
              fi
            done <<< "$patterns"
          done
        fi

        declare -a ALL_PATTERNS
        if [ "${#PATTERN_SET[@]}" -gt 0 ]; then
          mapfile -t ALL_PATTERNS < <(printf '%s\n' "${!PATTERN_SET[@]}" | LC_ALL=C sort)
        else
          ALL_PATTERNS=()
        fi

        # Use git ls-tree instead of find so this works even when the working
        # tree contains no files (e.g. after a sparse checkout with no patterns).
        {
          if [ "${#ALL_PATTERNS[@]}" -gt 0 ]; then
            git ls-tree -r --name-only -z "$HEAD_COMMIT" | while IFS= read -r -d '' file; do
              basename="${file##*/}"
              for pattern in "${ALL_PATTERNS[@]}"; do
                # Type patterns are intentionally interpreted as shell globs.
                # shellcheck disable=SC2053
                if [[ "$basename" == $pattern ]]; then
                  printf '%s\n' "$file"
                  break
                fi
              done
            done
          else
            git ls-tree -r --name-only -z "$HEAD_COMMIT" | while IFS= read -r -d '' file; do
              printf '%s\n' "$file"
            done
          fi
        } | LC_ALL=C sort > "$tmp_dir/find-matches.txt"
        LC_ALL=C sort "$tmp_dir/changed-files.txt" > "$tmp_dir/changed-files-sorted.txt"

        if [ -s "$tmp_dir/find-matches.txt" ]; then
          comm -12 "$tmp_dir/changed-files-sorted.txt" "$tmp_dir/find-matches.txt" > "$tmp_dir/initial-matched.txt" || true
        else
          cp "$tmp_dir/changed-files-sorted.txt" "$tmp_dir/initial-matched.txt"
        fi

        filter_by_include() {
          local file="$1"
          if [ "${#INCLUDE_PATTERNS[@]}" -eq 0 ]; then
            return 0
          fi
          for include_pattern in "${INCLUDE_PATTERNS[@]}"; do
            # Include filters are intentionally interpreted as shell globs.
            # shellcheck disable=SC2053
            [[ "$file" == $include_pattern ]] && return 0
          done
          return 1
        }

        filter_by_exclude() {
          local file="$1"
          for exclude_pattern in "${EXCLUDE_PATTERNS[@]}"; do
            # $exclude_pattern intentionally unquoted to enable glob matching
            # shellcheck disable=SC2053
            [[ "$file" == $exclude_pattern ]] && return 1
          done
          return 0
        }

        : > "$tmp_dir/matched-files.txt"
        while IFS= read -r matched_file; do
          [ -z "$matched_file" ] && continue
          if filter_by_include "$matched_file" && filter_by_exclude "$matched_file"; then
            printf '%s\n' "$matched_file" >> "$tmp_dir/matched-files.txt"
          fi
        done < "$tmp_dir/initial-matched.txt"

        if [ -s "$tmp_dir/matched-files.txt" ]; then
          echo "matched=true" >> "$GITHUB_OUTPUT"
          delimiter="EOF_$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
          while grep -Fqx -- "$delimiter" "$tmp_dir/matched-files.txt"; do
            delimiter="EOF_$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
          done
          {
            printf 'matched_files<<%s\n' "$delimiter"
            cat "$tmp_dir/matched-files.txt"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"
        else
          echo "matched=false" >> "$GITHUB_OUTPUT"
          echo "matched_files=" >> "$GITHUB_OUTPUT"
        fi
      # yamllint enable
